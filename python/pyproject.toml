[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lean-indented-notation"
version = "1.0.0"
description = "LIN (Lean Indented Notation): JSON's data model in fewer tokens, for AI agents"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
classifiers = ["Programming Language :: Python :: 3", "Topic :: Software Development :: Libraries"]

[project.urls]
Homepage = "https://github.com/david-brandt-the-icelander/lean-indented-notation"

[tool.setuptools.packages.find]
where = ["src"]
