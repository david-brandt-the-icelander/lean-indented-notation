[package]
name = "lin-cli"
description = "lin: the command-line tools for LIN (Lean Indented Notation) and JSON files"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

build = "build.rs"
include = ["src/**", "build.rs", "Cargo.toml", "embedded/**"]

[[bin]]
name = "lin"
path = "src/main.rs"

[dependencies]
lin-notation = { version = "1.0.0", path = "../lin", features = ["serde_json"] }
clap = { version = "4", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
jaq-core = "3"
jaq-std = "3"
jaq-json = { version = "2", features = ["serde"] }
jsonschema = { version = "0.62", default-features = false }
ureq = { version = "3", optional = true }
regex = "1"
globset = "0.4"
tiktoken-rs = { version = "0.12", optional = true }

[features]
default = ["net", "tokens"]
net = ["dep:ureq"]
tokens = ["dep:tiktoken-rs"]

[dev-dependencies]
