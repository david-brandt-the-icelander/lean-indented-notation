# Tells the CI/CD pipeline in david-brandt-the-icelander/continuous_integration_and_delivery
# (lean-indented-notation/) to run on this push. It needs a token that may dispatch events there,
# stored as the CICD_DISPATCH_TOKEN secret; without it this workflow does nothing.
name: Trigger CI/CD

on:
  push:
    branches: [main]
    tags: ["v*"]

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch to continuous_integration_and_delivery
        env:
          TOKEN: ${{ secrets.CICD_DISPATCH_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "CICD_DISPATCH_TOKEN is not set; skipping"
            exit 0
          fi
          release=false
          case "$GITHUB_REF" in refs/tags/v*) release=true ;; esac
          curl -fsS -X POST \
            -H "Authorization: Bearer $TOKEN" -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/david-brandt-the-icelander/continuous_integration_and_delivery/dispatches \
            -d "{\"event_type\":\"lean-indented-notation\",\"client_payload\":{\"ref\":\"$GITHUB_SHA\",\"release\":$release,\"tag\":\"$GITHUB_REF_NAME\"}}"
