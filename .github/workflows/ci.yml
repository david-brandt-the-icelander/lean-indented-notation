name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - run: cargo test --workspace
      - name: .lin and .json files in step, every file valid
        run: |
          cargo build --release -p lin-cli
          cd .. && rust/target/release/lin --offline sync --check . && rust/target/release/lin --offline check .
      - name: WebAssembly build and conformance
        run: |
          cargo install wasm-bindgen-cli --version 0.2.100 --locked
          lin-wasm/build.sh
          node lin-wasm/test.cjs

  typescript:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: typescript
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm test

  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s python/tests -v
      - name: The conformance files match the Python implementation
        run: |
          python tests/conformance/generate.py
          git diff --exit-code tests/conformance
